<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#14382f"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>自由账本</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5f3;color:#18362e;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:600px;margin:auto;padding:24px 16px 110px}h1{font-size:27px}h2{font-size:18px;margin-top:0}section{background:white;border-radius:20px;margin:12px 0;padding:18px}.hero{background:#14382f;color:white}.big{font-size:34px;font-weight:750;letter-spacing:-1px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}small{opacity:.75}button,input,select{font:inherit;border-radius:12px;padding:12px}button{border:0;background:#e2ede8;color:#18362e}button.primary,.active{background:#087e60;color:white}input,select{width:100%;border:1px solid #d5e3da;background:white;margin:6px 0 12px}nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #ddd}nav button{background:none;font-size:12px;flex:1;padding:5px}nav b{display:block;font-size:24px}.wide{width:100%}.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}.cats button{font-size:12px;padding:10px 2px}.cats b{display:block;font-size:23px}progress{width:100%;accent-color:#087e60}.line{padding:12px 0;border-bottom:1px solid #edf0ee}.red{color:#ad4545}.green{color:#087e60}dialog{border:0;border-radius:20px;width:calc(100% - 24px);max-width:550px;max-height:90dvh;overflow:auto}dialog::backdrop{background:#142c2788}.bar{background:#e5eee9;height:8px;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:#087e60}</style></head><body><main><div class="row"><small>自由账本 · USD</small><button onclick="masked=!masked;render()">显示 / 隐藏金额</button></div><div id="view"></div></main><nav><button onclick="go('home')"><b>⌂</b>首页</button><button onclick="go('ledger')"><b>▤</b>账单</button><button onclick="entry()"><b>＋</b>记账</button><button onclick="go('goals')"><b>◎</b>目标</button><button onclick="go('assets')"><b>◈</b>资产</button></nav><dialog id="modal"></dialog><script>
const $=x=>document.getElementById(x),key='freedom-v1',today=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},id=()=>crypto.randomUUID?.()||Date.now()+'-'+Math.random(),fresh=()=>({entries:[],accounts:[],history:[],budget:1500,monthly:2500,rate:5,start:today(),goals:[{name:'30岁前 · 第一桶金',target:100000,months:36},{name:'35岁前 · 退休计划',target:400000,months:96}]});let s;try{s=JSON.parse(localStorage.getItem(key))||fresh()}catch{s=fresh()}let page='home',month=today().slice(0,7),masked=false,kind='expense',cat='吃饭',editing;const expense={'理发':'💇','吃饭':'🍜','打车':'🚕','地铁':'🚇','生活':'🛒'},income={'工资':'💼','小费':'💵'};const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>masked?'••••':Number(n).toLocaleString('en-US',{style:'currency',currency:'USD'}),net=()=>s.accounts.reduce((a,b)=>a+(b.type==='debt'?-1:1)*b.amount,0),rows=()=>s.entries.filter(e=>e.date.startsWith(month)),sum=(r,k)=>r.filter(e=>e.kind===k).reduce((a,b)=>a+b.amount,0);function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch{alert('保存失败，请导出备份')}}function go(p){page=p;render();scrollTo(0,0)}function monthField(){return `<input type="month" value="${esc(month)}" onchange="month=this.value;render()">`}function line(e){return `<div class="line row"><div><strong>${esc((e.kind==='expense'?expense:income)[e.cat]||'📦')} ${esc(e.cat)}</strong><br><small>${esc(e.date)} ${esc(e.note)}</small></div><strong class="${e.kind==='income'?'green':'red'}">${e.kind==='income'?'+':'−'}${money(e.amount)}</strong><button data-id="${esc(e.id)}" onclick="entry(this.dataset.id)">编辑</button></div>`}function progress(g){let p=Math.max(0,Math.min(100,net()/g.target*100));return `<div class="row"><strong>${esc(g.name)}</strong><small>${p.toFixed(1)}%</small></div><progress max="100" value="${p}"></progress><div class="row"><small>${money(net())}</small><small>${money(g.target)}</small></div>`}function render(){let r=rows(),a=sum(r,'income'),b=sum(r,'expense'),h='';if(page==='home')h=`<h1>我的财富</h1><section class="hero"><small>当前净资产 · 手动更新</small><div class="big">${s.accounts.length?money(net()):'尚未录入'}</div><button onclick="go('assets')">管理资产</button></section>${monthField()}<div class="two"><section><small>收入</small><h2 class="green">${money(a)}</h2></section><section><small>支出</small><h2>${money(b)}</h2></section></div><section><div class="row"><strong>本月结余</strong><b>${money(a-b)}</b></div><p><small>预算剩余 ${money(s.budget-b)}</small></p><progress max="${Math.max(1,s.budget)}" value="${b}"></progress></section><button class="primary wide" onclick="entry()">＋ 快速记一笔</button><section><h2>财富目标</h2>${s.goals.map(progress).join('<hr>')}</section><section><h2>最近账单</h2>${r.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5).map(line).join('')||'暂无记录'}</section>`;if(page==='ledger'){let cats={};r.filter(e=>e.kind==='expense').forEach(e=>cats[e.cat]=(cats[e.cat]||0)+e.amount);h=`<h1>账单</h1>${monthField()}<section><h2>支出分析 · ${money(b)}</h2>${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row line"><span>${esc(k)}</span><b>${money(v)}</b></div><div class="bar"><i style="width:${v/b*100}%"></i></div>`).join('')||'暂无支出'}</section><section><input id="search" placeholder="搜索分类、备注" oninput="list()"><select id="filter" onchange="list()"><option value="all">全部</option><option value="expense">支出</option><option value="income">收入</option></select><div id="list"></div></section>`}if(page==='goals')h=`<h1>我的退休计划</h1><section><small>当前净资产</small><div class="big">${money(net())}</div><p>每月新增资产（美元）</p><input id="monthly" type="number" min="0" value="${s.monthly}"><small>假设年化收益率 %（非保证）</small><input id="rate" type="number" min="0" max="50" value="${s.rate}"><button class="primary wide" onclick="s.monthly=Math.max(0,+$('monthly').value||0);s.rate=Math.min(50,Math.max(0,+$('rate').value||0));save();render()">更新测算</button></section>`+s.goals.map((g,i)=>{let n=Math.max(0,Math.ceil(g.months-(Date.now()-new Date(s.start+'T00:00:00'))/2629800000)),m=(1+s.rate/100)**(1/12)-1,f=m?((1+m)**n-1)/m:n,base=net()*(1+m)**n;return `<section>${progress(g)}<p><small>剩余约 ${n} 个月 · 尚差 ${money(Math.max(0,g.target-net()))}</small></p><div class="two"><div><small>预计到期资产</small><h2>${money(base+s.monthly*f)}</h2></div><div><small>所需每月新增</small><h2>${n?money(Math.max(0,(g.target-base)/f)):'已到期'}</h2></div></div><small>从计划开始的总期限（月）</small><input type="number" min="1" max="600" value="${g.months}" onchange="s.goals[${i}].months=Math.min(600,Math.max(1,Math.round(+this.value)||1));save();render()"></section>`}).join('')+`<section><small>40万美元按3%–4%初始提取率约为每年12,000–16,000美元，未扣税，不保证可持续。测算假设统一收益率、每月末投入，不计税费、通胀及波动。</small></section>`;if(page==='assets')h=`<h1>资产与设置</h1><section class="hero"><small>资产减负债</small><div class="big">${money(net())}</div><small>余额独立手动更新，记账不会重复增减余额。</small></section><section><div class="row"><h2>账户</h2><button onclick="account()">＋添加</button></div>${s.accounts.map(a=>`<div class="line row"><span>${esc(a.name)}<br><small>${({cash:'银行 / 现金',invest:'股票 / 投资',debt:'负债'})[a.type]}</small></span><b>${money(a.amount)}</b><button data-id="${esc(a.id)}" onclick="account(this.dataset.id)">更新</button></div>`).join('')}</section><section><h2>资产历史</h2><button onclick="s.history=s.history.filter(x=>x.date!==today());s.history.push({date:today(),amount:net()});save();render()">记录今日净资产</button>${s.history.slice().reverse().map(x=>`<div class="line row"><span>${esc(x.date)}</span><b>${money(x.amount)}</b></div>`).join('')}</section><section><h2>月预算</h2><input type="number" min="0" value="${s.budget}" onchange="s.budget=Math.max(0,+this.value||0);save()"></section><section><h2>数据管理</h2><p><small>数据只存当前设备，清理浏览器数据可能丢失。请定期备份。</small></p><div class="row"><button onclick="backup()">备份 JSON</button><button onclick="csv()">导出 CSV</button></div><p><small>导入备份或 UTF-8 CSV（鲨鱼记账需先导出或转换，人民币需先换成 USD）</small></p><input type="file" accept=".csv,.json" onchange="load(this.files[0])"></section>`;$('view').innerHTML=h;if(page==='ledger')list()}
function list(){let q=$('search').value.toLowerCase(),f=$('filter').value;$('list').innerHTML=rows().filter(e=>(f==='all'||f===e.kind)&&(e.cat+' '+e.note).toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date)).map(line).join('')||'暂无记录'}function entry(eid){editing=s.entries.find(e=>e.id===eid);kind=editing?.kind||'expense';cat=editing?.cat||(expense[localStorage.getItem('lastcat')]?localStorage.getItem('lastcat'):'吃饭');$('modal').innerHTML=`<form id="form"><div class="row"><h2>快速记账</h2><button type="button" onclick="$('modal').close()">关闭</button></div><div class="two"><button type="button" id="expense" onclick="setKind('expense')">支出</button><button type="button" id="income" onclick="setKind('income')">收入</button></div><input id="amount" type="number" inputmode="decimal" min=".01" step=".01" required placeholder="0.00 USD" style="font-size:32px" value="${editing?.amount||''}"><div id="cats" class="cats"></div><input id="note" placeholder="备注（选填）" value="${esc(editing?.note)}"><input id="date" type="date" required value="${editing?.date||today()}"><button class="primary wide">保存记账</button>${editing?'<button type="button" class="wide red" onclick="removeEntry()">删除账单</button>':''}</form>`;$('modal').showModal();draw();$('amount').focus();$('form').onsubmit=e=>{e.preventDefault();let obj={id:editing?.id||id(),kind,cat,amount:+$('amount').value,date:$('date').value,note:$('note').value};if(!Number.isFinite(obj.amount)||obj.amount<=0)return;if(editing)s.entries=s.entries.map(x=>x.id===obj.id?obj:x);else s.entries.push(obj);if(kind==='expense')localStorage.setItem('lastcat',cat);month=obj.date.slice(0,7);save();$('modal').close();render()}}function setKind(k){kind=k;cat=k==='expense'?'吃饭':'工资';draw()}function draw(){let c=kind==='expense'?expense:income;if(!(cat in c))c={...c,[cat]:'📦'};$('expense').className=kind==='expense'?'active':'';$('income').className=kind==='income'?'active':'';$('cats').innerHTML=Object.entries(c).map(([k,v])=>`<button type="button" class="${cat===k?'active':''}" data-cat="${esc(k)}" onclick="cat=this.dataset.cat;draw()"><b>${v}</b>${esc(k)}</button>`).join('')}function removeEntry(){if(confirm('删除此账单？')){s.entries=s.entries.filter(x=>x.id!==editing.id);save();$('modal').close();render()}}
function account(eid){let a=s.accounts.find(x=>x.id===eid);$('modal').innerHTML=`<form id="af"><div class="row"><h2>账户余额</h2><button type="button" onclick="$('modal').close()">关闭</button></div><input id="an" required placeholder="账户名称，例如 Robinhood" value="${esc(a?.name)}"><select id="at">${[['cash','银行 / 现金'],['invest','股票 / 投资'],['debt','负债']].map(([k,v])=>`<option value="${k}" ${a?.type===k?'selected':''}>${v}</option>`).join('')}</select><input id="av" type="number" min="0" step=".01" required placeholder="余额（负债也填正数）" value="${a?.amount??''}"><button class="primary wide">保存</button></form>`;$('modal').showModal();$('af').onsubmit=e=>{e.preventDefault();let o={id:a?.id||id(),name:$('an').value,type:$('at').value,amount:+$('av').value};if(a)s.accounts=s.accounts.map(x=>x.id===o.id?o:x);else s.accounts.push(o);save();$('modal').close();render()};if(a){let b=document.createElement('button');b.type='button';b.textContent='删除账户';b.onclick=()=>{if(confirm('删除账户？')){s.accounts=s.accounts.filter(x=>x.id!==a.id);save();$('modal').close();render()}};$('af').append(b)}}function download(name,t,type){let u=URL.createObjectURL(new Blob([t],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function backup(){download('freedom-'+today()+'.json',JSON.stringify(s,null,2),'application/json')}function cell(v){v=String(v);if(/^[=+@-]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}function csv(){download('ledger-'+today()+'.csv','\ufeff'+['日期,类型,分类,金额,备注',...s.entries.map(e=>[e.date,e.kind==='income'?'收入':'支出',e.cat,e.amount,e.note].map(cell).join(','))].join('\n'),'text/csv;charset=utf-8')}function parse(t){let all=[],r=[],v='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(q&&t[i+1]==='"'){v+='"';i++}else q=!q}else if(c===','&&!q){r.push(v);v=''}else if(c==='\n'&&!q){r.push(v.replace(/\r$/,''));all.push(r);r=[];v=''}else v+=c}if(v||r.length){r.push(v.replace(/\r$/,''));all.push(r)}return all}async function load(file){if(!file)return;try{let t=(await file.text()).replace(/^\ufeff/,'');if(file.name.endsWith('.json')){let x=JSON.parse(t);if(!Array.isArray(x.entries)||!Array.isArray(x.accounts)||!Array.isArray(x.goals)||x.goals.length!==2||!Array.isArray(x.history)||!x.entries.every(e=>typeof e.date==='string'&&typeof e.id==='string'&&['income','expense'].includes(e.kind)&&Number.isFinite(e.amount)&&e.amount>0)||!x.accounts.every(a=>typeof a.id==='string'&&['cash','invest','debt'].includes(a.type)&&Number.isFinite(a.amount)&&a.amount>=0)||!x.goals.every(g=>Number.isFinite(g.target)&&g.target>0&&Number.isFinite(g.months)&&g.months>0))throw Error('备份格式错误');if(!confirm('替换当前账本？'))return;s={...fresh(),...x}}else{let [h,...r]=parse(t),f=names=>h.findIndex(k=>names.includes(k.trim().toLowerCase())),d=f(['日期','时间','记账日期','date']),k=f(['类型','收支','收支类型','type']),c=f(['分类','类别','category']),a=f(['金额','金额(元)','金额（元）','amount']),n=f(['备注','说明','note']);if([d,k,c,a].some(x=>x<0))throw Error('需要日期、类型、分类、金额列');let out=[],bad=0;for(let row of r){if(row.every(v=>!v.trim()))continue;let dt=(row[d]||'').match(/^(\d{4})[-/.年](\d{1,2})[-/.月](\d{1,2})/),amt=Number((row[a]||'').replace(/[$￥¥,\s]/g,'')),type=(row[k]||'').trim().toLowerCase();if(!dt||!Number.isFinite(amt)||!amt||!['收入','支出','income','expense'].includes(type)){bad++;continue}out.push({id:id(),date:dt[1]+'-'+dt[2].padStart(2,'0')+'-'+dt[3].padStart(2,'0'),kind:['收入','income'].includes(type)?'income':'expense',cat:row[c]||'其他',amount:Math.abs(amt),note:row[n]||''})}if(!confirm('识别 '+out.length+' 笔，跳过 '+bad+' 笔。确认金额均为 USD 后导入？'))return;let sig=e=>JSON.stringify([e.date,e.kind,e.cat,e.amount,e.note]),seen=new Set(s.entries.map(sig));s.entries.push(...out.filter(e=>!seen.has(sig(e))))}save();render();alert('导入完成')}catch(e){alert('导入失败：'+e.message)}}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
